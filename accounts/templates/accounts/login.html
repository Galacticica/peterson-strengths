{% extends "base.html" %}
{% load static %}

{% block content %}
<h2 class="text-3xl font-bold mb-2 flex justify-center">Log In</h2>
<div class="flex justify-center w-full">
    <div class="max-w-md w-full">
        <form method="post" action="{% url 'login_page' %}" class="bg-base-100 p-4 rounded-lg shadow">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="grid gap-3">
                <div>
                    <label for="id_email">Email</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>
                <div>
                    <label for="id_password">Password</label>
                    {{ form.password }}
                    {{ form.password.errors }}
                </div>
            </div>
            <button class="btn w-full mt-4" type="submit">Log In</button>
        </form>
        <div class="mt-4 text-center">
            <p>No Account Yet? <a href="{% url 'signup_page' %}" class="link">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
