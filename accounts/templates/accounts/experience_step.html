{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Experience & Previous Coaches</h2>
  <form method="post">
    {% csrf_token %}
    {{ exp_form.as_p }}
    <h3 class="text-xl font-semibold mt-6 mb-2">Previous Coaches</h3>
      <div id="coaches-container">
        <div class="coach-field flex items-center mb-2">
          <input type="text" name="coaches[]" class="form-input mr-2" placeholder="Enter coach name" />
          <button type="button" class="delete-coach btn btn-danger" onclick="deleteCoach(this)" style="display:none;">Delete</button>
        </div>
      </div>
      <button type="button" id="add-coach" class="btn btn-secondary mt-2">Add Coach</button>
      <div class="flex justify-between mt-6">
        <a href="{% url 'profile_step' %}" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn btn-primary">Next</button>
      </div>
      <script>
        <!-- JavaScript to handle dynamic addition/removal of previous coach fields -->
        const container = document.getElementById('coaches-container');
        const addBtn = document.getElementById('add-coach');
        function updateDeleteButtons() {
          const fields = container.querySelectorAll('.coach-field');
          fields.forEach((field, idx) => {
            const delBtn = field.querySelector('.delete-coach');
            delBtn.style.display = fields.length > 1 ? '' : 'none';
          });
        }
        function deleteCoach(btn) {
          btn.parentElement.remove();
          updateDeleteButtons();
        }
        addBtn.addEventListener('click', function() {
          const field = document.createElement('div');
          field.className = 'coach-field flex items-center mb-2';
          field.innerHTML = `<input type="text" name="coaches[]" class="form-input mr-2" placeholder="Enter coach name" />
            <button type="button" class="delete-coach btn btn-danger" onclick="deleteCoach(this)">Delete</button>`;
          container.appendChild(field);
          updateDeleteButtons();
        });
        updateDeleteButtons();
      </script>
  </form>
</div>
{% endblock %}
