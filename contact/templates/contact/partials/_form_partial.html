{% csrf_token %}
{{ form.non_field_errors }}
<div class="mb-4 w-full">
    <label for="id_name" class="block font-semibold mb-1">Name</label>
    <input type="text" name="name" id="id_name" class="input input-bordered w-full" placeholder="Your name" value="{{ form.name.value|default_if_none:'' }}" />
    {% if form.name.errors %}
        <div class="text-red-500 text-sm mt-1">{{ form.name.errors }}</div>
    {% endif %}
</div>
<div class="mb-4 w-full">
    <label for="id_email" class="block font-semibold mb-1">Email</label>
    <input type="email" name="email" id="id_email" class="input input-bordered w-full" placeholder="Your email" value="{{ form.email.value|default_if_none:'' }}" />
    {% if form.email.errors %}
        <div class="text-red-500 text-sm mt-1">{{ form.email.errors }}</div>
    {% endif %}
</div>
<div class="mb-4 w-full">
    <label for="id_message" class="block font-semibold mb-1">Your Message</label>
    <textarea id="id_message" name="message" class="textarea textarea-bordered w-full" rows="4" placeholder="Type your message here...">{{ form.message.value|default_if_none:'' }}</textarea>
    {% if form.message.errors %}
        <div class="text-red-500 text-sm mt-1">{{ form.message.errors }}</div>
    {% endif %}
</div>
<div class="flex justify-between mt-6">
    <button class="btn btn-primary" type="submit">Send Message</button>
</div>
